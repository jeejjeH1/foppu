:root {

  --line: #2a1838;
  --text: #f6ecff;
  --muted: #a493b8;
  --pink: #ff87ff;
  --purple: #dc00ff;
  --green: #b3ffcb;

* { box-sizing: border-box; }

h1 { margin: 0; font: 900 clamp(1.2rem, 4vw, 1.9rem)/1.2 "Unbounded", system-ui, sans-serif; letter-spacing: .04em; }
h1 span { color: var(--pink); }
.stage { position: relative; aspect-ratio: 16 / 9; background: #000; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stage canvas { display: block; width: 100%; height: 100%; }
.bigplay { position: absolute; inset: 0; margin: auto; width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer;
  background: linear-gradient(135deg, var(--pink), var(--purple)); color: #fff; font-size: 30px; box-shadow: 0 0 40px rgba(220, 0, 255, .6); }
.bigplay[hidden] { display: none; }
.transport { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.transport button { font: 700 14px "JetBrains Mono", monospace; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer; min-width: 104px; }
.transport button:hover { border-color: var(--purple); }
.transport input { flex: 1; min-width: 160px; accent-color: var(--purple); }
.time { font: 500 13px "JetBrains Mono", monospace; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 110px; text-align: right; }
body.capture { overflow: hidden; }
body.capture .wrap { padding: 0; max-width: none; display: block; }
body.capture h1, body.capture .transport, body.capture .bigplay { display: none; }
body.capture .stage { width: 1920px; height: 1080px; border: 0; border-radius: 0; }

  s.save(); s.setTransform(1, 0, 0, 1, 0, 0); s.globalAlpha = 1; s.globalCompositeOperation = 'source-over'; s.fillStyle = '#000'; s.fillRect(0, 0, W, H);
  s.globalCompositeOperation = 'lighter'; s.drawImage(CH[0], dx, 0); s.drawImage(CH[1], 0, (hash(fr, 4) - 0.5) * 6 * g); s.drawImage(CH[2], -dx, 0);
  s.globalCompositeOperation = 'source-over';
  TMPX.drawImage(SC, 0, 0);
  const n = Math.floor(3 + g * 14);
  for (let k = 0; k < n; k++) { const y = Math.floor(hash(fr, k, 1) * H), h = Math.floor(6 + hash(fr, k, 2) * 110 * g), off = (hash(fr, k, 3) - 0.5) * 300 * g; s.drawImage(TMP, 0, y, W, h, off, y, W, h); }
  s.globalCompositeOperation = 'lighter';
  for (let k = 0; k < Math.floor(g * 10); k++) { s.fillStyle = rgba(hash(fr, k, 5) < 0.5 ? 'pink' : 'green', 0.12 + 0.2 * hash(fr, k, 6)); s.fillRect(hash(fr, k, 7) * W, hash(fr, k, 8) * H, 40 + hash(fr, k, 9) * 260, 4 + hash(fr, k, 10) * 24); }
  s.restore();
}
function render(tIn) {
  const t = clamp(tIn, 0, DUR), fx = fxAt(t), s = SX;
  s.setTransform(1, 0, 0, 1, 0, 0); s.globalAlpha = 1; s.globalCompositeOperation = 'source-over'; s.filter = 'none';
  drawBG(s, t);
  s.save();
  s.translate(960 + fx.sx, 540 + fx.sy); s.rotate(fx.rot); s.translate(-960, -540);
  for (const [a, b, fn] of SCENES) if (t >= a && t <= b) { s.save(); fn(s, t); s.restore(); }
  s.restore();
  drawHUD(s, t);
  if (fx.gl > 0.02) glitchFX(fx.gl, t);
  const o = CTX;
  o.setTransform(1, 0, 0, 1, 0, 0); o.globalCompositeOperation = 'source-over'; o.globalAlpha = 1;
  o.drawImage(SC, 0, 0);
  B1X.clearRect(0, 0, B1.width, B1.height); B1X.filter = 'contrast(1.6) blur(4px)'; B1X.drawImage(SC, 0, 0, B1.width, B1.height); B1X.filter = 'none';
  B2X.clearRect(0, 0, B2.width, B2.height); B2X.filter = 'blur(5px)'; B2X.drawImage(B1, 0, 0, B2.width, B2.height); B2X.filter = 'none';
  o.globalCompositeOperation = 'lighter'; o.globalAlpha = 0.5; o.drawImage(B1, 0, 0, W, H); o.globalAlpha = 0.45; o.drawImage(B2, 0, 0, W, H);
  if (fx.flash > 0) { o.globalCompositeOperation = 'screen'; o.globalAlpha = Math.min(1, fx.flash); o.fillStyle = '#ffd6ff'; o.fillRect(0, 0, W, H); }
  o.globalCompositeOperation = 'source-over'; o.globalAlpha = 1; o.drawImage(VIGNETTE, 0, 0);
  const fr = Math.floor(t * 30);
  o.save(); o.globalCompositeOperation = 'overlay'; o.globalAlpha = 0.07; o.fillStyle = NOISE[fr % 4]; o.translate(-Math.floor(hash(fr, 1) * 256), -Math.floor(hash(fr, 2) * 256)); o.fillRect(0, 0, W + 256, H + 256); o.restore();
  o.globalAlpha = 0.08; o.fillStyle = SCANLINES; o.fillRect(0, 0, W, H);
  const fade = Math.min(seg(t, 0, 0.35), 1 - seg(t, DUR - 1.0, DUR));
  if (fade < 1) { o.globalAlpha = 1 - fade; o.fillStyle = '#000'; o.fillRect(0, 0, W, H); }
  o.globalAlpha = 1;
}

/* ================= player ================= */
const snd = document.getElementById('snd'), playBtn = document.getElementById('play'), bigplay = document.getElementById('bigplay');
const scrub = document.getElementById('scrub'), timeEl = document.getElementById('time'), muteBtn = document.getElementById('mute');
let playing = false, cur = 3.3, wall0 = 0, cur0 = 0, soundOn = true, audioOk = true;
snd.addEventListener('error', () => { audioOk = false; muteBtn.disabled = true; muteBtn.textContent = 'No audio'; });
function setPlaying(p) {
  playing = p; playBtn.innerHTML = p ? '&#10074;&#10074; Pause' : '&#9654; Play'; bigplay.hidden = p || CAPTURE;
  if (p) { if (cur >= DUR - 0.05) cur = 0; wall0 = performance.now(); cur0 = cur; if (audioOk && soundOn) { try { snd.currentTime = cur; } catch (e) { /* not seekable yet */ } snd.play().catch(() => {}); } }
  else snd.pause();
}
playBtn.addEventListener('click', () => setPlaying(!playing));
bigplay.addEventListener('click', () => { cur = 0; setPlaying(true); });
muteBtn.addEventListener('click', () => { soundOn = !soundOn; muteBtn.textContent = soundOn ? 'Sound: on' : 'Sound: off'; snd.muted = !soundOn; if (playing && soundOn) { snd.currentTime = cur; snd.play().catch(() => {}); } });
scrub.addEventListener('input', () => { cur = +scrub.value; wall0 = performance.now(); cur0 = cur; if (audioOk && playing) snd.currentTime = cur; });
function loop(now) {
  if (playing) {
    cur = audioOk && soundOn && !snd.paused && snd.readyState >= 2 ? snd.currentTime : cur0 + (now - wall0) / 1000;
    if (cur >= DUR) { cur = DUR; setPlaying(false); }
  }
  render(cur);
  scrub.value = cur.toFixed(2); timeEl.textContent = `${cur.toFixed(2)} / ${DUR.toFixed(1)}`;
  requestAnimationFrame(loop);
}
window.renderAt = t => render(t);
window.DURATION = DUR;
const FONTS = ['900 40px Unbounded', '700 40px Unbounded', '500 40px Unbounded', '700 40px "Space Grotesk"', '500 40px "Space Grotesk"', '700 40px "JetBrains Mono"', '500 40px "JetBrains Mono"'];
Promise.all(FONTS.map(f => document.fonts.load(f))).catch(() => {}).then(() => {
  LC.clear();
  window.READY = true;
  if (CAPTURE) render(0); else requestAnimationFrame(loop);
});
})();
</script>
